plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.calcs.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.calcs.app'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // A fixed key kept in the project, so every new build installs over the previous one.
    signingConfigs {
        calcs {
            storeFile file('calcs.keystore')
            storePassword 'calcs123'
            keyAlias 'calcs'
            keyPassword 'calcs123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.calcs }
        release {
            signingConfig signingConfigs.calcs
            minifyEnabled false
        }
    }

    buildFeatures { compose true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
}
