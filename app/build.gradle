plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.calcs.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.calcs.app'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    // A fixed key kept in the project, so every new build installs over the previous one.
    signingConfigs {
        calcs {
            storeFile file('calcs.keystore')
            storePassword 'calcs123'
            keyAlias 'calcs'
            keyPassword 'calcs123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.calcs }
        // The APK you install is the optimised release build: R8-shrunk, not debuggable → smooth scrolling.
        release {
            signingConfig signingConfigs.calcs
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { compose true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all { it.maxHeapSize = '3g' }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    // screenshot tests (run in CI only)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
