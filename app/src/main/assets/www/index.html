<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcs</title>
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #17202b; --muted: #5b6878; --line: #dce2ea;
  --in-bg: #fff8e1; --in-line: #ecd894; --res-bg: #f1f8f3; --key-bg: #def1e3; --key-ink: #145a2c;
  --ok: #1d7a3a; --bad: #b3261e; --bad-bg: #fde8e6; --warn: #9a6700;
  --head: #27364a; --head-ink: #ffffff; --shadow: 0 1px 2px rgba(20,32,48,.06), 0 4px 14px rgba(20,32,48,.05);
  --water: #1f6fd1; --drain: #8a5a1e; --rain: #0e8a83; --fire: #c9342b; --units: #5b5bd6;
  --accent: #27364a; --accent-soft: #e8edf4;
  --v-good: #2e9e5b; --v-ok: #d99a00; --v-bad: #d23c3c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #161d25; --surface-2: #1b242e; --ink: #e6ecf2; --muted: #93a1b1; --line: #2a3542;
    --in-bg: #2a2513; --in-line: #5c4f22; --res-bg: #15221b; --key-bg: #173a25; --key-ink: #9be0b0;
    --ok: #5ccf83; --bad: #ff8a80; --bad-bg: #3a1a18; --warn: #f2c14e;
    --head: #2c3b50; --head-ink: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.3);
    --water: #5aa2ff; --drain: #d49a52; --rain: #3cc7bd; --fire: #ff6b5e; --units: #9a9aff;
    --accent-soft: #1f2a36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #161d25; --surface-2: #1b242e; --ink: #e6ecf2; --muted: #93a1b1; --line: #2a3542;
  --in-bg: #2a2513; --in-line: #5c4f22; --res-bg: #15221b; --key-bg: #173a25; --key-ink: #9be0b0;
  --ok: #5ccf83; --bad: #ff8a80; --bad-bg: #3a1a18; --warn: #f2c14e;
  --head: #2c3b50; --head-ink: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.3);
  --water: #5aa2ff; --drain: #d49a52; --rain: #3cc7bd; --fire: #ff6b5e; --units: #9a9aff;
  --accent-soft: #1f2a36; color-scheme: dark;
}
body[data-accent="water"] { --accent: var(--water); }
body[data-accent="drain"] { --accent: var(--drain); }
body[data-accent="rain"] { --accent: var(--rain); }
body[data-accent="fire"] { --accent: var(--fire); }
body[data-accent="units"] { --accent: var(--units); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "HarmonyOS Sans", "Noto Sans", sans-serif;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
.num, .tnum, td, .tile-v { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); }
.bar-in { display: flex; align-items: center; gap: 10px; min-height: 58px; }
.bar h1 { font-size: 18px; margin: 0; letter-spacing: .1px; }
.bar .crumb { font-size: 12px; color: var(--muted); }
.bar .grow { flex: 1; min-width: 0; }
.bar .grow > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
  display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; cursor: pointer;
  font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn svg { width: 16px; height: 16px; }
.btn:active, .iconbtn:active { transform: translateY(1px); }
.stripe { height: 4px; background: var(--accent); }

/* tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; white-space: nowrap;
  cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* home */
.hero { padding-block: 26px 8px; }
.hero h2 { font-size: 30px; margin: 0; letter-spacing: -.3px; }
.hero p { margin: 4px 0 0; color: var(--muted); }
.grid-home { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding-block: 14px 26px; }
.bcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; cursor: pointer; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; min-width: 0; text-align: left; }
.bcard::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
.bcard .code { width: 46px; height: 46px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center;
  font-weight: 800; letter-spacing: .5px; }
.bcard h3 { margin: 0; font-size: 18px; }
.bcard p { margin: 0; color: var(--muted); font-size: 13.5px; }
.bcard ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.bcard li { font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }

/* cards & fields */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 14px; min-width: 0; }
.card > h3 { margin: 0; padding: 14px 16px 0; font-size: 15px; color: var(--accent); letter-spacing: .2px; }
.card .help { margin: 6px 16px 0; color: var(--muted); font-size: 13px; }
.card-body { padding: 12px 16px 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.split.single { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 760px) { .split { grid-template-columns: minmax(0, 1fr); } }
.fields { display: flex; flex-direction: column; gap: 8px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) 120px 74px; gap: 8px; align-items: center; }
.field label { font-size: 14px; }
.field .hint { grid-column: 1 / -1; margin-top: -4px; font-size: 12px; color: var(--muted); }
.field .unit { font-size: 12.5px; color: var(--muted); }
.field.wide { grid-template-columns: minmax(0, 1fr) 210px; }
@media (max-width: 460px) { .field { grid-template-columns: minmax(0, 1fr) 100px 58px; } .field.wide { grid-template-columns: minmax(0,1fr); } }
input.in, select.in { width: 100%; min-width: 0; height: 40px; border-radius: 9px; border: 1px solid var(--in-line); background: var(--in-bg);
  padding: 0 10px; text-align: right; outline: none; }
select.in { text-align: left; padding-right: 4px; }
input.in:focus, select.in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input.in.text { text-align: left; }

/* results list */
.res { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; align-self: start; }
.res .r { display: grid; grid-template-columns: minmax(0, 1fr) auto 58px; gap: 8px; padding: 8px 12px; background: var(--res-bg); align-items: baseline; }
.res .r + .r { border-top: 1px solid var(--line); }
.res .r .v { font-weight: 700; text-align: right; min-width: 0; max-width: min(56vw, 340px); overflow-wrap: anywhere; }
.res .r .u { font-size: 12px; color: var(--muted); }
.res .r.key { background: var(--key-bg); }
.res .r.key .l, .res .r.key .v { color: var(--key-ink); font-weight: 750; }
.ok { color: var(--ok) !important; } .bad { color: var(--bad) !important; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .tile-l { font-size: 12px; color: var(--muted); }
.tile .tile-v { font-size: 21px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.tile .tile-v small { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-left: 3px; }

.toolhead { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; padding-block: 6px 12px; }
.toolhead .t { flex: 1; min-width: 200px; }
.toolhead h2 { margin: 0; font-size: 22px; }
.toolhead p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }

/* tables */
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; }
table.g { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.g th { background: var(--head); color: var(--head-ink); font-weight: 650; font-size: 12px; text-align: left; padding: 8px 8px; vertical-align: bottom;
  position: sticky; top: 0; line-height: 1.25; min-width: 64px; }
table.g td { padding: 4px 8px; border-top: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.g td.fx { color: var(--ink); }
table.g td.fx.dim { color: var(--muted); }
table.g td.o { text-align: right; background: var(--res-bg); font-weight: 600; }
table.g td.o.key { background: var(--key-bg); color: var(--key-ink); font-weight: 800; }
table.g td.o.txt { text-align: left; font-weight: 600; }
table.g tr.used td.fx:first-child { font-weight: 700; }
table.g tr.tot td { background: var(--surface-2); font-weight: 800; }
table.g td.inp { padding: 3px 4px; min-width: 86px; }
table.g td.inp.wide { min-width: 190px; }
table.g td.inp.sel { min-width: 130px; }
table.g td.inp input.in, table.g td.inp select.in { height: 36px; }
table.g td.del { width: 40px; padding: 2px 4px; }
.delbtn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; color: var(--muted); }
.gridfoot { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }

.note { color: var(--muted); font-size: 13px; border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 4px 0 18px; }

/* sketch */
.sketch svg { height: auto; display: block; margin: 0 auto; max-width: none; }
.sketch .node { cursor: pointer; }
.sketch-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 10px; }
.sketch-info .box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); font-size: 13.5px; min-width: 0; }
.sketch-info .box b { display: block; margin-bottom: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 18px; height: 5px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }

/* project */
.proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.proj label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.proj input.in { text-align: left; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

/* toast & sheet */
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0;
  background: #1f2a36; color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; transition: .2s; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.sheet-bg { position: fixed; inset: 0; background: rgba(10,15,20,.45); z-index: 40; display: grid; place-items: end center; }
.sheet { background: var(--surface); width: min(520px, 100%); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h4 { margin: 0 0 4px; font-size: 17px; }
.sheet p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
.sheet .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet .opt { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface-2); cursor: pointer; text-align: left; }
.sheet .opt b { display: block; font-size: 16px; }
.sheet .opt span { font-size: 12.5px; color: var(--muted); }
.sheet .cancel { margin-top: 10px; width: 100%; justify-content: center; }

/* units */
.units-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; }
@media (max-width: 760px) { .units-grid { grid-template-columns: minmax(0,1fr); } }
.conv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.foot { color: var(--muted); font-size: 12px; padding-block: 8px 28px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="engine.js"></script>
<script src="tools.js"></script>
<script src="report.js"></script>
<script src="pdf.js"></script>
<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
